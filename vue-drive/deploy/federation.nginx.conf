# Install inside http {}. DNS names refer to the deployment's private Hub gateways.
upstream drive_one { server cloudfile-one:80; }
upstream drive_two { server cloudfile-two:80; }

server {
    listen 80;
    server_name drive.example.com;
    root /srv/cloudfile-vue;

    location = / { try_files /inst/1/index.html =404; }
    location ^~ /inst/1/assets/ { try_files $uri =404; }
    location ~ "^/inst/(?:1|2)(?:/[0-9A-Fa-f-]{36})?/?$" { try_files /inst/1/index.html =404; }

    location ~ ^/inst/1/(?:api2|api/v2\.1|oauth|accounts)/ {
        rewrite ^/inst/1(/.*)$ $1 break;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "cfi1_session=$cookie_cfi1_session; cfi1_csrf=$cookie_cfi1_csrf; via_oauth=$cookie_via_oauth";
        proxy_cookie_path / /inst/1/;
        proxy_pass http://drive_one;
    }
    location ~ ^/inst/2/(?:api2|api/v2\.1|oauth|accounts)/ {
        rewrite ^/inst/2(/.*)$ $1 break;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "cfi2_session=$cookie_cfi2_session; cfi2_csrf=$cookie_cfi2_csrf; via_oauth=$cookie_via_oauth";
        proxy_cookie_path / /inst/2/;
        proxy_pass http://drive_two;
    }
    # Use these locations when the Hub issues a portal-local FILE_SERVER_ROOT.
    location ^~ /inst/1/seafhttp/ {
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://drive_one/seafhttp/;
    }
    location ^~ /inst/2/seafhttp/ {
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://drive_two/seafhttp/;
    }
    location / { return 404; }
}
