{% extends "base.html" %}
{% load i18n %}
{% block main_content %}
<div class="container my-4">
  <h2>{% trans "Operation log" %}</h2>
  <form id="audit-filters" class="form-inline mb-3">
    <input class="form-control mr-2" name="repo_id" placeholder="{% trans 'Library ID' %}">
    <input class="form-control mr-2" name="user" placeholder="{% trans 'User' %}">
    <select class="form-control mr-2" name="op_type"><option value="">{% trans "All operations" %}</option><option>create</option><option>edit</option><option>update</option><option>delete</option><option>rename</option><option>move</option><option>recover</option></select>
    <select class="form-control mr-2" name="obj_type"><option value="">{% trans "All objects" %}</option><option value="file">{% trans "File" %}</option><option value="dir">{% trans "Folder" %}</option><option value="tag">{% trans "Tag" %}</option></select>
    <select class="form-control mr-2" name="source"><option value="">{% trans "All sources" %}</option><option value="web">web</option><option value="desktop">desktop</option><option value="mobile">mobile</option><option value="api">api</option><option value="system">system</option><option value="admin">admin</option><option value="commit">commit</option></select>
    <select class="form-control mr-2" name="result"><option value="">{% trans "All results" %}</option><option value="success">{% trans "success" %}</option><option value="failure">{% trans "failure" %}</option></select>
    <input class="form-control mr-2" name="path" placeholder="{% trans 'Path' %}">
    <input class="form-control mr-2" name="start" placeholder="{% trans 'From (epoch s)' %}">
    <input class="form-control mr-2" name="end" placeholder="{% trans 'To (epoch s)' %}">
    <button class="btn btn-primary mr-2">{% trans "Filter" %}</button>
    <a class="btn btn-secondary" id="audit-export" href="#">{% trans "Export CSV" %}</a>
  </form>
  <table class="table"><thead><tr><th>{% trans "Time" %}</th><th>{% trans "User" %}</th><th>{% trans "Operation" %}</th><th>{% trans "Type" %}</th><th>{% trans "Source" %}</th><th>{% trans "Result" %}</th><th>{% trans "Library" %}</th><th>{% trans "Path" %}</th></tr></thead><tbody id="audit-events"></tbody></table>
</div>
<script>
(() => { const form=document.querySelector('#audit-filters'), body=document.querySelector('#audit-events'), exportBtn=document.querySelector('#audit-export');
  const esc=(s)=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const qs=()=>new URLSearchParams(new FormData(form));
  const load=async()=>{const r=await fetch('{{ SITE_ROOT }}api/v2.1/cloudfile/audit/?'+qs(),{credentials:'same-origin'}); const d=await r.json(); body.innerHTML=(d.events||[]).map(e=>{const p=e.old_path?esc(e.old_path)+' → ':''; return `<tr><td>${esc(e.time)}</td><td>${esc(e.user)}</td><td>${esc(e.operation)}</td><td>${esc(e.object_type)}</td><td>${esc(e.source)}</td><td>${esc(e.result)}</td><td>${esc(e.repo_id)}</td><td>${p}${esc(e.path)}</td></tr>`;}).join('');};
  form.addEventListener('submit',e=>{e.preventDefault();load();});
  exportBtn.addEventListener('click',e=>{e.preventDefault();window.location='{{ SITE_ROOT }}api/v2.1/cloudfile/audit/export/?'+qs();});
  load(); })();
</script>
{% endblock %}
