name: CloudFile quick source checks

# Routine PRs get source syntax checks only; Seahub packaging, native
# integration and cross-repository verification are manually dispatched.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject obsolete managed-library code and native fallback
        run: python3 cloudfile_ext/v2/tests/test_no_managed_boundary.py

      - name: Validate additive ACL batch and shared cache contracts
        run: python3 -m unittest cloudfile_ext.v2.tests.test_acl_batch_pure

      - name: Test storage key grammar only when storage code changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD -- cloudfile_ext/storage/ | grep -q .; then
            python3 -m unittest cloudfile_ext.storage.tests.test_key_policy
          fi

      - name: Validate only changed source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', 'HEAD^', 'HEAD']
          ).split(b'\0')
          for raw in changed:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if path.is_file() and path.suffix == '.py':
                  compile(path.read_bytes(), str(path), 'exec')
          PY
          while IFS= read -r path; do
            [[ ! -f "$path" ]] || bash -n "$path"
          done < <(git diff --name-only HEAD^ HEAD -- '*.sh')

  # Temporary P1-only MariaDB reality check for Hub PR #70. Remove before merge.
  storage-pr70-mariadb:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/storage-repo-key-api-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: storage-test-only
          MARIADB_DATABASE: fixture
        ports:
          - 13319:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Use current Server V2 five-table schema (test fixture only)
        uses: actions/checkout@v4
        with:
          repository: eaopen/cloudfile-server
          ref: c8c35480a0255e38e38a5b30c7132d04536967ae
          path: cloudfile-server
      - name: Install only MariaDB test client library
        run: python3 -m pip install --disable-pip-version-check pymysql==1.1.1
      - name: Run targeted storage reconcile tests against disposable MariaDB
        env:
          CF_STORAGE_TEST_MYSQL_PORT: "13319"
        run: |
          CF_V2_DDL="$GITHUB_WORKSPACE/cloudfile-server/scripts/sql/mysql/cloudfile-v2.sql" \
            python3 -m unittest \
              cloudfile_ext.v2.tests.test_storage_reconcile.ConfigTests \
              cloudfile_ext.v2.tests.test_storage_reconcile.StorageSQLTests -v
