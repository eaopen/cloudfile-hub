name: V2 OIDC identity proof

on:
  push:
    branches: [dev]
    paths:
      - 'cloudfile_ext/v2/oidc.py'
      - 'cloudfile_ext/v2/tests/test_oidc.py'
      - '.github/workflows/v2-identity.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'cloudfile_ext/v2/oidc.py'
      - 'cloudfile_ext/v2/tests/test_oidc.py'
      - '.github/workflows/v2-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]==2.13.*'
      - run: python -m unittest cloudfile_ext.v2.tests.test_oidc -v
